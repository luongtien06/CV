<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Luong Ngoc Tien — CV</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,600;1,400&family=DM+Sans:wght@300;400;500&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
    <link rel="icon" href="img/face.jpg" type="image/x-icon">
<style>
    /* ── RESET ── */
    *, *::before, *::after { margin:0; padding:0; box-sizing:border-box; }
    :root {
        --glass:      rgba(255,255,255,0.11);
        --glass-h:    rgba(255,255,255,0.18);
        --border:     rgba(255,255,255,0.18);
        --border-h:   rgba(255,255,255,0.35);
        --shadow:     0 8px 32px rgba(0,0,0,0.35);
        --shadow-h:   0 20px 48px rgba(0,0,0,0.5);
        --accent:     rgba(180,210,255,0.85);
        --accent-dim: rgba(160,195,255,0.45);
        --ok:         #4ade80;
        --text:       rgba(255,255,255,0.92);
        --text-muted: rgba(255,255,255,0.55);
        --radius:     20px;
        --radius-sm:  12px;
        --mono: 'JetBrains Mono', ui-monospace, monospace;
        --ease-spring: cubic-bezier(0.34, 1.56, 0.64, 1);
        --ease-out-expo: cubic-bezier(0.19, 1, 0.22, 1);
    }
    html { scroll-behavior: smooth; }
    body {
        min-height: 100vh;  display: flex;
        flex-direction: column; align-items: center;
        background: url('https://static.vecteezy.com/system/resources/previews/026/423/787/large_2x/abstract-technology-background-with-circuit-board-and-blue-lights-digital-communication-line-concept-graphic-hardware-computer-tech-integrated-energy-design-information-internet-generative-ai-photo.jpg')
                    no-repeat center center / cover fixed;
        color: var(--text); font-family: 'DM Sans', sans-serif;
        overflow-x: hidden; padding-bottom: 80px;
    }
    .bg-overlay {
        position: fixed; inset: 0;
        background: radial-gradient(ellipse at center, rgba(10,18,30,0.30) 0%, rgba(10,18,30,0.55) 100%);
        -webkit-backdrop-filter: blur(8px) saturate(1.2);
        backdrop-filter: blur(8px) saturate(1.2);
        z-index: 0;
    }

    /* ── Particle Canvas ── */
    #particleCanvas {
        position: fixed; inset: 0; z-index: 0;
        pointer-events: none;
        opacity: 0.5;
    }

    /* ── GLASS CARD ── */
    .glass-card {
        position: relative; z-index: 1; background: var(--glass);
        -webkit-backdrop-filter: blur(20px) saturate(1.4);
        backdrop-filter: blur(20px) saturate(1.4);
        border: 1px solid var(--border);
        border-radius: var(--radius);  padding: 22px;
        box-shadow: var(--shadow); margin-bottom: 14px;
        transform-style: preserve-3d;
        transform: perspective(800px) rotateX(0deg) rotateY(0deg);
        transition: transform 300ms var(--ease-spring),
                    box-shadow 300ms ease,
                    border-color 300ms ease;
        will-change: transform;
    }
    .glass-card::before {
        content: '';
        position: absolute; inset: 0; border-radius: inherit;
        background: linear-gradient(
            135deg,
            rgba(255,255,255,0.20) 0%,
            rgba(255,255,255,0.05) 30%,
            transparent 50%
        );
        opacity: 0;
        transition: opacity 500ms ease;
        pointer-events: none;
    }
    .glass-card:hover::before {
        opacity: 1;
    }
    .glass-card::after {
        content: '';
        position: absolute; inset: -1px; border-radius: inherit;
        background: linear-gradient(135deg,
            rgba(160,200,255,0.25) 0%,
            transparent 40%,
            transparent 60%,
            rgba(160,200,255,0.10) 100%
        );
        opacity: 0;
        transition: opacity 400ms ease;
        pointer-events: none;
        z-index: -1;
        -webkit-mask: linear-gradient(#000, #000) content-box, linear-gradient(#000, #000);
        mask: linear-gradient(#000, #000) content-box, linear-gradient(#000, #000);
        -webkit-mask-composite: xor;
        mask-composite: exclude;
        padding: 1px;
    }
    .glass-card:hover::after {
        opacity: 1;
    }
    .glass-card:hover {
        box-shadow: var(--shadow-h);
        border-color: var(--border-h);
    }
    .glass-inner {
        background: rgba(255,255,255,0.07);
        border: 1px solid rgba(255,255,255,0.1);
        border-radius: var(--radius-sm); padding: 14px 16px;
        margin-top: 10px;  transition: background 200ms, transform 200ms var(--ease-spring);
    }
    .glass-inner:hover { background: rgba(255,255,255,0.11); transform: translateY(-2px); }

    /* ── LAYOUT (Chuyển sang 2 cột cân đối và tinh tế) ── */
    .container {
        display: grid;
        grid-template-columns: 280px 1fr;
        grid-template-areas: "sidebar main";
        gap: 22px; width: calc(100% - 60px);
        max-width: 1200px; margin: 40px auto 0;
        position: relative; z-index: 1;
    }
    .sidebar-left {
        grid-area: sidebar;
        display: flex;
        flex-direction: column;
        gap: 16px;
        position: sticky;
        top: 20px;
        height: fit-content;
    }
    .main-content {
        grid-area: main;
        display: flex;
        flex-direction: column;
        gap: 16px;
    }

    /* ── CLOCK CARD ── */
    .clock-card { text-align: center; }
    .clock-time {
        font-family: 'Playfair Display', serif;
        font-size: 2.2rem; font-weight: 400; letter-spacing: 2px;
        color: #fff; text-shadow: 0 0 18px rgba(160,200,255,.6);
        line-height: 1.1;
        transition: text-shadow 300ms ease;
    }
    .clock-card:hover .clock-time {
        text-shadow: 0 0 30px rgba(160,200,255,.9), 0 0 60px rgba(160,200,255,.3);
    }
    .clock-ampm {
        font-size: .75rem; letter-spacing: 3px;
        text-transform: uppercase; color: var(--accent-dim);
        margin-top: 4px;
    }
    .clock-date {
        font-size: .8rem; letter-spacing: 1.5px;
        color: var(--text-muted); margin-top: 10px;
        line-height: 1.5;
    }
    .divider {
        width: 100%; height: 1px;
        background: linear-gradient(90deg, transparent, var(--border-h), transparent);
        margin: 14px 0; opacity: .6;
    }

    /* ── SECTION LABELS ── */
    .section-label {
        font-size: .7rem; letter-spacing: 3px;
        text-transform: uppercase; color: var(--accent-dim);
        margin-bottom: 14px; display: flex;
        align-items: center; gap: 8px;
    }
    .section-label::after {
        content: ''; flex: 1; height: 1px;
        background: linear-gradient(90deg, var(--border), transparent);
    }

    /* ── NEW PROJECTS GRID LAYOUT (Bố trí dạng lưới 2 cột bắt mắt) ── */
    .projects-grid {
        display: grid;
        grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
        gap: 16px;
        margin-top: 10px;
    }
    .project-item {
        position: relative;
        display: flex;
        flex-direction: column;
        gap: 10px;
        padding: 18px;
        border-radius: var(--radius-sm);
        background: rgba(255, 255, 255, 0.05);
        border: 1px solid rgba(255, 255, 255, 0.09);
        text-decoration: none;
        color: var(--text);
        transition: transform 300ms var(--ease-spring),
                    border-color 300ms ease,
                    background-color 300ms ease,
                    box-shadow 300ms ease;
    }
    .project-item:hover {
        transform: translateY(-4px);
        background: rgba(255, 255, 255, 0.1);
        border-color: rgba(160, 200, 255, 0.45);
        box-shadow: 0 10px 24px rgba(0, 0, 0, 0.25);
    }
    .project-header-row {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 12px;
    }
    .project-title-area {
        display: flex;
        align-items: center;
        gap: 12px;
    }
    .project-icon-placeholder {
        width: 38px;
        height: 38px;
        background: rgba(160, 200, 255, 0.12);
        border: 1px solid rgba(160, 200, 255, 0.25);
        border-radius: 10px;
        display: flex;
        align-items: center;
        justify-content: center;
        color: var(--accent);
        font-size: 1.15rem;
        transition: transform 300ms var(--ease-spring), background 200ms;
    }
    .project-item:hover .project-icon-placeholder {
        transform: scale(1.1) rotate(5deg);
        background: rgba(160, 200, 255, 0.22);
    }
    .project-title-area h4 {
        font-size: 0.95rem;
        font-weight: 600;
        color: #fff;
        letter-spacing: 0.5px;
    }
    .project-arrow {
        font-size: 0.75rem;
        color: var(--text-muted);
        transition: transform 300ms var(--ease-spring), color 300ms;
    }
    .project-item:hover .project-arrow {
        transform: translate(2px, -2px);
        color: var(--accent);
    }
    .project-body {
        font-size: 0.8rem;
        color: var(--text-muted);
        line-height: 1.5;
        flex-grow: 1;
    }
    .project-footer {
        display: flex;
        gap: 6px;
        flex-wrap: wrap;
        margin-top: 4px;
    }
    .project-tech-badge {
        font-family: var(--mono);
        font-size: 0.62rem;
        background: rgba(160, 200, 255, 0.08);
        border: 1px solid rgba(160, 200, 255, 0.15);
        color: var(--accent);
        padding: 2px 8px;
        border-radius: 4px;
    }

    /* ── REDESIGNED QUICK STATS CARD (Thống kê dạng thẻ sang xịn) ── */
    .quick-stats-grid {
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 10px;
        margin-top: 10px;
    }
    .quick-stat-box {
        background: rgba(255, 255, 255, 0.05);
        border: 1px solid rgba(255, 255, 255, 0.08);
        border-radius: var(--radius-sm);
        padding: 14px 6px;
        transition: background 200ms ease, transform 200ms var(--ease-spring);
    }
    .quick-stat-box:hover {
        background: rgba(160, 200, 255, 0.12);
        border-color: rgba(160, 200, 255, 0.3);
        transform: translateY(-2px);
    }
    .quick-stat-box strong {
        display: block;
        font-family: 'Playfair Display', serif;
        font-size: 1.7rem;
        color: #fff;
        text-shadow: 0 0 10px rgba(160,200,255,0.4);
    }
    .quick-stat-box span {
        display: block;
        font-size: 0.65rem;
        letter-spacing: 0.5px;
        text-transform: uppercase;
        color: var(--text-muted);
        margin-top: 6px;
    }

    .skill-group {
        font-size: .72rem; color: var(--text);
        text-transform: uppercase; letter-spacing: .08em;
        width: 100%; margin-top: 12px; margin-bottom: 4px;
    }
    .skills-wrap { display: flex; flex-wrap: wrap; gap: 7px; margin-top: 4px; }
    .skill-tag {
        font-size: .72rem; letter-spacing: 1px; text-transform: uppercase;
        padding: 4px 10px; border-radius: 20px;
        background: rgba(160,200,255,.1); border: 1px solid rgba(160,200,255,.22);
        color: var(--accent);
        transition: transform 200ms var(--ease-spring),
                    background 200ms ease,
                    border-color 200ms ease,
                    box-shadow 200ms ease;
        cursor: default;
    }
    .skill-tag:hover {
        transform: translateY(-2px) scale(1.04);
        background: rgba(160,200,255,.2);
        border-color: rgba(160,200,255,.45);
        box-shadow: 0 4px 12px rgba(160,200,255,.15);
    }

    .exp-desc {
        margin-top: 8px; font-size: .78rem; line-height: 1.55; color: var(--text-muted);
    }

    /* ── TERMINAL / SIGNATURE UPTIME PANEL ── */
    .uptime-console {
        font-family: var(--mono);
        background: rgba(0,0,0,.28);
        border: 1px solid rgba(255,255,255,.08);
        border-radius: var(--radius-sm);
        padding: 12px 14px;
        font-size: .72rem;
        line-height: 2;
    }
    .uptime-line { display: flex; justify-content: space-between; gap: 10px; }
    .uptime-label { color: var(--text-muted); }
    .uptime-value { color: var(--text); }
    .uptime-value.available { color: var(--ok); }
    .uptime-value.available::before {
        content: '●'; margin-right: 5px; font-size: .6rem;
        color: var(--ok); text-shadow: 0 0 6px var(--ok);
        animation: statusPulse 2.5s ease-in-out infinite;
    }
    .uptime-cursor {
        display: inline-block; width: 6px; height: 11px;
        background: var(--accent); margin-left: 2px;
        vertical-align: -1px;
        animation: blink .9s step-end infinite;
    }

    /* ── PROFILE HEADER ── */
    .profile-header { display: flex; align-items: center; gap: 20px; }
    .avatar-wrap { position: relative; flex-shrink: 0; }
    .avatar {
        width: 120px; height: 120px; border-radius: 50%;
        overflow: hidden; border: 2px solid rgba(255,255,255,.35);
        box-shadow: 0 0 0 4px rgba(160,200,255,.15), 0 8px 24px rgba(0,0,0,.4);
        transition: transform 300ms var(--ease-spring), box-shadow 300ms ease;
    }
    .avatar:hover { transform: scale(1.04); box-shadow: 0 0 0 6px rgba(160,200,255,.25), 0 12px 32px rgba(0,0,0,.5); }
    .avatar img { width:100%; height:100%; object-fit:cover; display:block; }
    .status-dot {
        position: absolute; bottom: 6px; right: 6px;
        width: 14px; height: 14px; border-radius: 50%;
        background: var(--ok); border: 2px solid rgba(0,0,0,.4);
        box-shadow: 0 0 8px rgba(74,222,128,.7);
        animation: statusPulse 2.5s ease-in-out infinite;
    }
    @keyframes statusPulse {
        0%,100% { box-shadow: 0 0 6px rgba(74,222,128,.6); transform: scale(1); }
        50%      { box-shadow: 0 0 18px rgba(74,222,128,1); transform: scale(1.1); }
    }
    .profile-info { flex: 1; min-width: 0; }
    .profile-info h1 {
        font-family: 'Playfair Display', serif;
        font-size: clamp(1.2rem, 2.5vw, 1.65rem);
        font-weight: 600; letter-spacing: 1.5px;
        line-height: 1.2;
        background: linear-gradient(
            135deg,
            #ffffff 0%,
            #aad4ff 30%,
            #7abaff 50%,
            #aad4ff 70%,
            #ffffff 100%
        );
        background-size: 200% auto;
        -webkit-background-clip: text;
        background-clip: text;
        -webkit-text-fill-color: transparent;
        animation: shimmerText 6s linear infinite;
        overflow: hidden; white-space: nowrap;
    }
    @keyframes shimmerText {
        0%   { background-position: 0% center; }
        100% { background-position: 200% center; }
    }
    .cursor {
        display: inline-block;  width: 2px; height: 1.1em;
        background: var(--accent); margin-left: 3px;
        vertical-align: text-bottom;
        animation: blink .9s step-end infinite;
    }
    @keyframes blink { 0%,100%{opacity:1} 50%{opacity:0} }
    .profile-role {
        font-size: .78rem; letter-spacing: 2.5px;
        text-transform: uppercase; color: var(--accent-dim);
        margin-top: 5px; display: flex; align-items: center; gap: 8px;
    }
    /* ── SOCIAL ICONS ── */
    .social-icons { display: flex; gap: 10px; margin-top: 14px; flex-wrap: wrap; }
    .social-icons a {
        display: inline-flex; align-items: center;
        justify-content: center; width: 36px; height: 36px;
        background: rgba(255,255,255,.07);
        border: 1px solid var(--border);
        border-radius: 10px; color: var(--text-muted);
        text-decoration: none; font-size: .9rem;
        transition: transform 200ms var(--ease-spring),
                    background 200ms ease,
                    color 200ms ease,
                    border-color 200ms ease,
                    box-shadow 200ms ease;
        position: relative;
        overflow: hidden;
    }
    .social-icons a::before {
        content: '';
        position: absolute; inset: 0;
        background: linear-gradient(135deg, rgba(160,200,255,0.2), transparent);
        opacity: 0;
        transition: opacity 200ms ease;
    }
    .social-icons a:hover::before { opacity: 1; }
    .social-icons a:nth-child(1):hover { border-color: #ea4335; color: #ea4335; }
    .social-icons a:nth-child(2):hover { border-color: #0a66c2; color: #0a66c2; }
    .social-icons a:nth-child(3):hover { border-color: #f0f6fc; color: #f0f6fc; }
    .social-icons a:nth-child(4):hover { border-color: #1877f2; color: #1877f2; }
    .social-icons a:hover {
        transform: translateY(-4px) scale(1.08);
        background: rgba(255,255,255,.16);
        box-shadow: 0 8px 24px rgba(0,0,0,.35);
    }
    .social-icons a:focus-visible, .project-item:focus-visible {
        outline: 2px solid var(--accent); outline-offset: 2px;
    }
    /* ── ABOUT / EXPERIENCE ── */
    .about-section h3, .experience-section h3 {
        font-family: 'Playfair Display', serif;
        font-size: 1rem; font-weight: 400;
        letter-spacing: 1px; margin-bottom: 8px; color: #fff;
    }
    .about-section p { font-size: .88rem; line-height: 1.7; color: var(--text-muted); }
    .experience-section { margin-top: 18px; }
    .exp-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; margin-top: 4px; }
    .exp-item {
        transition: transform 200ms var(--ease-spring), box-shadow 200ms ease, background 200ms ease;
    }
    .exp-item:hover {
        transform: translateY(-3px) scale(1.01);
        box-shadow: 0 8px 24px rgba(0,0,0,.25);
    }
    .exp-item h4 { font-size: .88rem; font-weight: 500; color: var(--text); margin-bottom: 4px; }
    .exp-item .company { font-size: .75rem; color: var(--text-muted); letter-spacing: .5px; }
    .exp-item .period { font-size: .7rem; color: var(--accent-dim); margin-top: 4px; letter-spacing: 1px; }

    /* ── FOOTER ── */
    footer {
        position: fixed; bottom: 0; left: 0; right: 0; z-index: 10;
        display: flex; justify-content: space-between; align-items: center;
        padding: 12px 20px;
        background: rgba(10,18,30,.6);
        -webkit-backdrop-filter: blur(16px); backdrop-filter: blur(16px);
        border-top: 1px solid rgba(255,255,255,.08);
        font-size: .75rem; letter-spacing: 2px; text-transform: uppercase;
        color: var(--text-muted);
    }
    footer .footer-left { flex: 1; text-align: left; }
    footer .footer-center { flex: 1; text-align: center; }
    footer .footer-right { flex: 1; text-align: right; display: flex; gap: 10px; align-items: center; justify-content: flex-end; }
    footer span { color: rgba(255,120,120,.7); }
    footer .fa-heart { color: rgba(255,80,80,.8); animation: heartBeat 1.5s ease-in-out infinite; display: inline-block; }
    @keyframes heartBeat {
        0%,100% { transform: scale(1); }
        15%     { transform: scale(1.3); }
        30%     { transform: scale(1); }
        45%     { transform: scale(1.15); }
        60%     { transform: scale(1); }
    }
    
    /* Language switcher button */
    .lang-switch-btn {
        display: inline-flex; align-items: center; gap: 6px;
        padding: 6px 12px; border-radius: 8px;
        background: rgba(160,200,255,.12); border: 1px solid rgba(160,200,255,.28);
        color: var(--text); font-size: .75rem; cursor: pointer; text-decoration: none;
        transition: transform 160ms var(--ease-spring), background 120ms ease;
        text-transform: uppercase; letter-spacing: 1px; font-weight: 500;
    }
    .lang-switch-btn:hover { transform: translateY(-2px); background: rgba(160,200,255,.22); }
    
    /* Move download button to footer */
    .download-btn-footer {
        display: inline-block; padding: 6px 12px; border-radius: 8px;
        background: rgba(160,200,255,.12); border: 1px solid rgba(160,200,255,.28);
        color: var(--text); font-size: .75rem; cursor: pointer; text-decoration: none;
        transition: transform 160ms var(--ease-spring), background 120ms ease;
    }
    .download-btn-footer:hover { transform: translateY(-2px); background: rgba(160,200,255,.22); }

    /* ── ENTRANCE ANIMATIONS ── */
    .animate-group { opacity: 0; }
    .animate-group.visible { opacity: 1; }

    @keyframes fadeInUp {
        from { opacity: 0; transform: translateY(30px) scale(0.97); }
        to   { opacity: 1; transform: none; }
    }
    @keyframes fadeInLeft {
        from { opacity: 0; transform: translateX(-30px); }
        to   { opacity: 1; transform: none; }
    }
    @keyframes fadeInRight {
        from { opacity: 0; transform: translateX(30px); }
        to   { opacity: 1; transform: none; }
    }
    @keyframes scaleIn {
        from { opacity: 0; transform: scale(0.85); }
        to   { opacity: 1; transform: none; }
    }
    @keyframes fadeIn {
        from { opacity: 0; }
        to   { opacity: 1; }
    }

    .anim {
        opacity: 0;
        animation-fill-mode: both;
        animation-timing-function: var(--ease-spring);
    }
    .anim-fade-up   { animation: fadeInUp 0.7s var(--ease-spring) both; }
    .anim-fade-left { animation: fadeInLeft 0.6s var(--ease-spring) both; }
    .anim-fade-right{ animation: fadeInRight 0.6s var(--ease-spring) both; }
    .anim-scale     { animation: scaleIn 0.6s var(--ease-spring) both; }
    .anim-fade      { animation: fadeIn 0.5s ease both; }

    /* stagger delays */
    .d1 { animation-delay: 0.08s; }
    .d2 { animation-delay: 0.18s; }
    .d3 { animation-delay: 0.30s; }
    .d4 { animation-delay: 0.42s; }
    .d5 { animation-delay: 0.56s; }
    .d6 { animation-delay: 0.70s; }

    /* ── RESPONSIVE ── */
    @media (max-width: 900px) {
        .container {
            grid-template-columns: 1fr;
            grid-template-areas: "main";
            display: flex;
            flex-direction: column;
            gap: 16px;
            width: calc(100% - 32px);
            margin: 20px auto 0;
        }
        .sidebar-left {
            position: static;
            width: 100%;
            flex-direction: row;
            flex-wrap: wrap;
        }
        .sidebar-left > .glass-card {
            flex: 1 1 240px;
            margin-bottom: 0;
        }
    }
    @media (max-width: 600px) {
        .sidebar-left {
            flex-direction: column;
        }
        .projects-grid {
            grid-template-columns: 1fr;
        }

    function avatarFallback(name, size) {

        if (document.getElementById('label-education')) document.getElementById('label-education').textContent = lang === 'en' ? 'Education' : 'Giáo Dục';
        if (document.getElementById('label-certifications')) document.getElementById('label-certifications').textContent = lang === 'en' ? 'Certifications' : 'Chứng Chỉ';
        
        // Update sidebar & Quick card labels

        if (document.getElementById('text-years')) document.getElementById('text-years').textContent = data.yearsText;

        // Update profile role
        document.getElementById('profileRole').innerHTML =
            `${data.role} <span style="opacity:.5">·</span> ${CONFIG.classCode}`;

    /* ── STAT COUNTERS ── */
    function animateCount(el, target, suffix = '') {
        const duration = 1200;
        const startTime = performance.now();
        const startVal = 0;

        function tick(now) {
            const elapsed = now - startTime;
            const progress = Math.min(elapsed / duration, 1);
            const eased = 1 - Math.pow(1 - progress, 3); // ease-out cubic
            const current = Math.round(startVal + (target - startVal) * eased);
            el.textContent = current + suffix;
            if (progress < 1) requestAnimationFrame(tick);
        }
        requestAnimationFrame(tick);
    }

    const start = new Date(CONFIG.startDate);
    const msPerYear = 365.25 * 24 * 60 * 60 * 1000;
    const yearsSince = (Date.now() - start.getTime()) / msPerYear;

    const yearsCountEl = document.getElementById('yearsCount');

    // Trigger counters when cards become visible
    const quickCard = document.querySelector('.quick-card');
    const observer = new IntersectionObserver((entries) => {
        entries.forEach(entry => {
            if (entry.isIntersecting) {
                // Sử dụng độ dài từ bảng dữ liệu của ngôn ngữ hiện tại
                const projCount = LANGUAGE_DATA[currentLanguage].projects.length;
                animateCount(projectCountEl, projCount);
                if (yearsSince >= 1) {
                    animateCount(yearsCountEl, Math.floor(yearsSince), '+');
                } else {
                    yearsCountEl.textContent = '<1';
                }
                observer.unobserve(entry.target);
            }
        });
    }, { threshold: 0.5 });
    observer.observe(quickCard);

    /* ── CLOCK ── */
    function updateClock() {
        const now  = new Date();
        let h      = now.getHours();
        const m    = String(now.getMinutes()).padStart(2,'0');
        const s    = String(now.getSeconds()).padStart(2,'0');
        const ampm = h >= 12 ? 'PM' : 'AM';
        h = h % 12 || 12;

        document.getElementById('clockTime').textContent = `${String(h).padStart(2,'0')}:${m}:${s}`;
        document.getElementById('clockAmpm').textContent = ampm;

        // Dùng API toLocaleDateString nội tại để định dạng ngày chuẩn hóa theo ngôn ngữ
        const locale = currentLanguage === 'vi' ? 'vi-VN' : 'en-US';
        const options = { weekday: 'short', day: 'numeric', month: 'short' };
        const dateString = now.toLocaleDateString(locale, options);
        document.getElementById('clockDate').innerHTML = `${dateString}<br>${now.getFullYear()}`;
    }
    setInterval(updateClock, 1000);

    /* ── UPTIME ── */
    function updateUptime() {
        const diffMs = Date.now() - start.getTime();
        const totalSec = Math.floor(diffMs / 1000);
        const days = Math.floor(totalSec / 86400);
        const hh = String(Math.floor((totalSec % 86400) / 3600)).padStart(2,'0');
        const mm = String(Math.floor((totalSec % 3600) / 60)).padStart(2,'0');
        const ss = String(totalSec % 60).padStart(2,'0');
        
        const daySuffix = LANGUAGE_DATA[currentLanguage].uptimeDays;
        document.getElementById('upTimer').innerHTML =
            `${days}${daySuffix} ${hh}:${mm}:${ss}<span class="uptime-cursor"></span>`;

    /* ── TYPING EFFECT (smoother, with random speed + pause) ── */
    const nameEl = document.getElementById('typingName');
    let idx = 0;
    let isDeleting = false;

    function typeEffect() {
        const fullName = CONFIG.name;
        if (!isDeleting) {
            if (idx <= fullName.length) {
                nameEl.innerHTML = fullName.slice(0, idx) + '<span class="cursor"></span>';
                idx++;
                const delay = 60 + Math.random() * 50;
                setTimeout(typeEffect, delay);
            } else {
                setTimeout(() => {
                    isDeleting = true;
                    typeEffect();
                }, 3000);
            }
        } else {
            if (idx > 0) {
                idx--;
                nameEl.innerHTML = fullName.slice(0, idx) + '<span class="cursor"></span>';
                const delay = 30 + Math.random() * 20;
                setTimeout(typeEffect, delay);
            } else {
                isDeleting = false;
                setTimeout(typeEffect, 1000);
            }
        }
    }
    setTimeout(typeEffect, 600);

    /* ── YEAR ── */
    document.getElementById('yr').textContent = new Date().getFullYear();

    /* ── 3D TILT EFFECT ── */
    const cards = document.querySelectorAll('[data-tilt]');
    cards.forEach(card => {
        card.addEventListener('mousemove', (e) => {
            const rect = card.getBoundingClientRect();
            const x = e.clientX - rect.left;
            const y = e.clientY - rect.top;
            const centerX = rect.width / 2;
            const centerY = rect.height / 2;
            const rotateX = ((y - centerY) / centerY) * -6;
            const rotateY = ((x - centerX) / centerX) * 6;
            card.style.transform = `perspective(800px) rotateX(${rotateX}deg) rotateY(${rotateY}deg)`;
        });
        card.addEventListener('mouseleave', () => {
            card.style.transform = 'perspective(800px) rotateX(0deg) rotateY(0deg)';
        });
    });

    let particles = [];
    let animId;
    let mouseX = 0, mouseY = 0;

    function resizeCanvas() {
        canvas.width = window.innerWidth;
        canvas.height = window.innerHeight;
    }
    window.addEventListener('resize', resizeCanvas);
    resizeCanvas();

    class Particle {
        constructor() {
            this.reset();
        }
        reset() {
            this.x = Math.random() * canvas.width;
            this.y = Math.random() * canvas.height;
            this.size = Math.random() * 2 + 0.5;
            this.speedX = (Math.random() - 0.5) * 0.3;
            this.speedY = (Math.random() - 0.5) * 0.3;
            this.opacity = Math.random() * 0.5 + 0.2;
            this.pulse = Math.random() * Math.PI * 2;
            this.pulseSpeed = Math.random() * 0.02 + 0.01;
        }
        update() {
            this.pulse += this.pulseSpeed;
            this.x += this.speedX;
            this.y += this.speedY;

            // Mouse interaction
            const dx = mouseX - this.x;
            const dy = mouseY - this.y;
            const dist = Math.sqrt(dx * dx + dy * dy);
            if (dist < 150) {
                const force = (150 - dist) / 150 * 0.5;
                this.x -= dx * force * 0.01;
                this.y -= dy * force * 0.01;
            }

            // Wrap around
            if (this.x < 0) this.x = canvas.width;
            if (this.x > canvas.width) this.x = 0;
            if (this.y < 0) this.y = canvas.height;
            if (this.y > canvas.height) this.y = 0;
        }
        draw() {
            const currentOpacity = this.opacity * (0.7 + 0.3 * Math.sin(this.pulse));
            ctx.beginPath();
            ctx.arc(this.x, this.y, this.size, 0, Math.PI * 2);
            ctx.fillStyle = `rgba(160, 200, 255, ${currentOpacity})`;
            ctx.fill();
        }
    }

    // Create particles
    const particleCount = Math.min(Math.floor(window.innerWidth * 0.05), 60);
    for (let i = 0; i < particleCount; i++) {
        particles.push(new Particle());
    }

    // Mouse tracking
    document.addEventListener('mousemove', (e) => {
        mouseX = e.clientX;
        mouseY = e.clientY;
    });

    function animateParticles() {
        ctx.clearRect(0, 0, canvas.width, canvas.height);
        particles.forEach(p => {
            p.update();
            p.draw();
        });
        // Draw lines between nearby particles
        for (let i = 0; i < particles.length; i++) {
            for (let j = i + 1; j < particles.length; j++) {
                const dx = particles[i].x - particles[j].x;
                const dy = particles[i].y - particles[j].y;
                const dist = Math.sqrt(dx * dx + dy * dy);
                if (dist < 120) {
                    ctx.beginPath();
                    ctx.moveTo(particles[i].x, particles[i].y);
                    ctx.lineTo(particles[j].x, particles[j].y);
                    const opacity = (1 - dist / 120) * 0.2;
                    ctx.strokeStyle = `rgba(160, 200, 255, ${opacity})`;
                    ctx.lineWidth = 0.5;
                    ctx.stroke();
                }
            }
        }
        animId = requestAnimationFrame(animateParticles);
    }

    // Start particles animation
    animateParticles();

    // --- Print / Download CV support ---
    function prepareAndPrint() {
        try {
            document.body.classList.add('print-mode');
            const overlay = document.querySelector('.bg-overlay');
            const canvasEl = document.getElementById('particleCanvas');
            if (overlay) overlay.style.display = 'none';
            if (canvasEl) canvasEl.style.display = 'none';
            setTimeout(() => {
                window.print();
                setTimeout(() => {
                    document.body.classList.remove('print-mode');
                    if (overlay) overlay.style.display = '';
                    if (canvasEl) canvasEl.style.display = '';
                }, 500);
            }, 250);
        } catch (e) {
            console.error('Print error', e);
            window.print();
        }
    }

    const downloadBtn = document.getElementById('downloadCvBtn');
    if (downloadBtn) downloadBtn.addEventListener('click', prepareAndPrint);

    window.addEventListener('beforeunload', () => {
        if (animId) cancelAnimationFrame(animId);
    });

    const prefersReducedMotion = window.matchMedia('(prefers-reduced-motion: reduce)');
    if (prefersReducedMotion.matches) {
        canvas.style.display = 'none';
        document.querySelectorAll('.anim').forEach(el => {
            el.style.opacity = '1';
            el.style.animation = 'none';
        });
    }
</script>
</body>
</html>
